name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PROOFKIT_MODE: sample
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app.py run_demo.py tests
      - run: node --check static/app.js
      - run: python -m pytest -q
      - run: python tests/run_smoke.py
      - name: Docker build and synthetic HTTP workflow
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          set -eu
          docker build -t signaldesk-ci .
          trap 'docker rm -f signaldesk-ci-check >/dev/null 2>&1 || true' EXIT
          docker run -d --name signaldesk-ci-check -p 127.0.0.1:8010:8000 signaldesk-ci
          python tests/http_smoke.py --base-url http://127.0.0.1:8010
          docker stop -t 40 signaldesk-ci-check
